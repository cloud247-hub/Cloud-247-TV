name: Build Android TV

on:
  workflow_dispatch:
  push:
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android-tv/app/build/outputs/apk/debug/app-debug.apk Cloud247-TV-Android-v1.5.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloud247-TV-Android-v1.5.2
          path: Cloud247-TV-Android-v1.5.2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NOTES="Android v1.5.2 fixes ESPN Golf HTTP 403 by preferring site.web.api.espn.com and falling back to site.api.espn.com, keeping golf available without API keys."
          if gh release view android-tv-v1.5.2 >/dev/null 2>&1; then
            gh release upload android-tv-v1.5.2 Cloud247-TV-Android-v1.5.2.apk --clobber
            gh release edit android-tv-v1.5.2 --title "Cloud247 TV Android v1.5.2" --notes "$RELEASE_NOTES"
          else
            gh release create android-tv-v1.5.2 Cloud247-TV-Android-v1.5.2.apk --title "Cloud247 TV Android v1.5.2" --notes "$RELEASE_NOTES"
          fi
