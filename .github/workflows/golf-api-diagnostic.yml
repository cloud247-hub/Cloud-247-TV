name: Golf API diagnostic

on:
  push:
    paths:
      - ".github/workflows/golf-api-diagnostic.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check ESPN golf endpoints
        shell: bash
        run: |
          set +e
          FROM=20260926
          TO=20261024
          for host in site.web.api.espn.com site.api.espn.com; do
            for tour in pga eur lpga liv; do
              url="https://$host/apis/site/v2/sports/golf/$tour/scoreboard?dates=$FROM-$TO&limit=100"
              echo "=== $host / $tour ==="
              code=$(curl -L -sS -A "Cloud247-TV-Golf/1.5.4" -H "Accept: application/json" -o /tmp/golf.json -w "%{http_code}" "$url")
              echo "HTTP=$code"
              if [ "$code" = "200" ]; then
                jq -r '"events=" + ((.events // []) | length | tostring)' /tmp/golf.json
                jq -r '(.events // [])[:5][] | [.date,.name,.id] | @tsv' /tmp/golf.json
              else
                head -c 300 /tmp/golf.json || true
                echo
              fi
            done
          done

          echo "=== CORE PGA events ==="
          url="https://sports.core.api.espn.com/v2/sports/golf/leagues/pga/events?limit=100"
          code=$(curl -L -sS -A "Cloud247-TV-Golf/1.5.4" -H "Accept: application/json" -o /tmp/core.json -w "%{http_code}" "$url")
          echo "HTTP=$code"
          if [ "$code" = "200" ]; then
            jq -r '"items=" + ((.items // []) | length | tostring)' /tmp/core.json
            jq -r '(.items // [])[:5][] | ."$ref"' /tmp/core.json
          else
            head -c 300 /tmp/core.json || true
            echo
          fi
