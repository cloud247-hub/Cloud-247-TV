name: Check Tizen TV

on:
  workflow_dispatch:
  push:
    paths:
      - "tizen-tv/**"
      - ".github/workflows/tizen-tv.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check tizen-tv/js/app.js
          node --check tizen-tv/vendor/qrcode.js

      - name: Validate config.xml
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('tizen-tv/config.xml'); print('config.xml OK')"

      - name: Validate Windows setup script syntax
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tizen-tv/Setup-Tizen.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "Setup-Tizen.ps1 syntax OK"

      - name: Build source bundle
        run: |
          cd tizen-tv
          zip -r ../Cloud247-TV-Tizen-v1.0.3-source.zip . -x "*.wgt" ".build/*" ".sign/*" ".vscode/settings.json"

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: Cloud247-TV-Tizen-v1.0.3-source
          path: Cloud247-TV-Tizen-v1.0.3-source.zip
          retention-days: 30

      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tizen-tv-v1.0.3 >/dev/null 2>&1; then
            gh release upload tizen-tv-v1.0.3 Cloud247-TV-Tizen-v1.0.3-source.zip --clobber
          else
            gh release create tizen-tv-v1.0.3 Cloud247-TV-Tizen-v1.0.3-source.zip \
              --title "Cloud247 TV Samsung Tizen v1.0.3" \
              --notes "Samsung TV v1.0.3 adds fullscreen remote channel switching with D-pad and CH+/CH-, while keeping the existing smart groups and pairing flow. Build/sign the WGT locally with your Samsung certificate profile."
          fi
